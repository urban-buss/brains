name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.submodule }} / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: [cellarbrain, recipebrain]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ matrix.submodule }}
    steps:
      - name: Checkout parent (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.submodule }}/pyproject.toml

      - name: Install editable + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q
