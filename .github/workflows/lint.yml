name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: ruff (${{ matrix.submodule }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: [cellarbrain, recipebrain]
    defaults:
      run:
        working-directory: ${{ matrix.submodule }}
    steps:
      - name: Checkout parent (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .
